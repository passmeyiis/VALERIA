{% extends "shared/base.html" %}
{% block title %}Edit Project{% endblock %}
{% block page_title %}Edit Project{% endblock %}

{% block content %}
<div style="padding: 20px 0; max-width: 800px;">
    <div style="margin-bottom: 20px;">
        <a href="{{ url_for('admin.list_projects') }}" style="color: #58a6ff; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;">
            &larr; Kembali ke Daftar Projects
        </a>
    </div>

    <div style="background-color: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);">
        <form method="POST">
            {% for key, val in project.items() %}
                {% if key != 'id' %}
                <div style="margin-bottom: 16px;">
                    <label style="display: block; color: var(--text-muted); font-size: 13px; font-weight: 600; margin-bottom: 6px; text-transform: capitalize;">
                        {{ key | replace('_', ' ') }}
                    </label>
                    <input type="text" name="{{ key }}" value="{{ val }}" style="width: 100%; background-color: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 13px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border-strong)'">
                </div>
                {% endif %}
            {% endfor %}

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" style="background-color: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px var(--primary-soft);">
                    Simpan Perubahan
                </button>
                <a href="{{ url_for('admin.list_projects') }}" style="background-color: var(--surface-2); color: var(--text); padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid var(--border-strong); display: inline-block;">
                    Batal
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
