<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password — Valeria</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-shell">
  <div class="login-card" style="max-width: 500px; min-height: auto;">
    <div class="login-form-side" style="width: 100%; flex: 1; padding: 40px;">
      <h2>Pemulihan Sandi</h2>
      <p class="lead">Masukkan email akun lu untuk menerima kode verifikasi.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('forgot_password') }}" method="POST">
        <div class="field">
          <label for="email">Email Terdaftar</label>
          <input type="email" id="email" name="email" placeholder="nama@domain.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Kirim Kode Verifikasi</button>
      </form>

      <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('login') }}" style="color: var(--primary); font-size: 13px; font-weight: 600;">← Kembali ke Login</a>
      </div>
    </div>
  </div>
</body>
</html>
